<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>A front end talking to a REST API.</p>
  </header>

  <main>
    <section aria-labelledby="load-heading">
      <h2 id="load-heading">Your notes</h2>
      <button type="button" id="load-btn">Load notes</button>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="notes-list"></ul>
    </section>

    <section aria-labelledby="add-heading">
      <h2 id="add-heading">Add a note</h2>
      <form id="note-form" novalidate>
        <div class="field">
          <label for="title-input">Title (required, max 100 characters)</label>
          <input type="text" id="title-input" name="title" autocomplete="off">
        </div>
        <div class="field">
          <label for="body-input">Body</label>
          <textarea id="body-input" name="body" rows="4"></textarea>
        </div>
        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
